# Claims as tests. Every public-facing sentence in README.md ("What the code enforces") and
# docs/client-explainer.md is tied here to the tests that make it true, and scripts/claims_check.py runs those
# tests by node id. If a claim has no passing test, or a sentence in either document is not covered by a claim,
# the build fails.
#
#   python scripts/claims_check.py            run every listed test; exit 1 if any claim lacks a passing one
#   python scripts/claims_check.py --static   check the file and the documents only (no tests run)
#   python scripts/claims_check.py --list     print the claims and their tests
#
# Shape of a claim:
#   id       short name (used in reports and by --only)
#   says     where the claim is made: [{file, quote}], quote being a plain-text fragment of that file
#            (markdown bold and code marks are ignored when matching). A document edit that removes
#            or rewords the fragment fails the check until the claim is re-read and re-tied.
#   tests    pytest node ids relative to the repo root, `path.py::test_name[::more]` (a name without a
#            parameter id selects every parameter), or `vitest:<ui test file>::<test title>`.
#            ALL listed tests must pass; a skipped test does not count as passing.
#   caveat   (optional) where the sentence says more than the code enforces. Printed as a warning on every run.
#
# `covered` names the documents whose every paragraph, bullet and table row must hold at least one `says`
# quote; `exempt` lists the few sentences that make no claim (framing), each with a reason.

version: 1

covered:
  - file: README.md
    section: "What the code enforces"
  - file: docs/client-explainer.md

exempt:
  - file: README.md
    text: "These are the claims this repository stands behind"
    why: "Introduces the list; makes no claim of its own."
  - file: docs/client-explainer.md
    text: "We build your images from the 3D model in 3ds Max and V-Ray"
    why: "Framing paragraph; each rule it points to is a bullet below, tied to its own tests."
  - file: docs/client-explainer.md
    text: "Some AI services run on our own computers"
    why: "Introduces the grade table; each grade is a row below."
  - file: docs/client-explainer.md
    text: "Questions about any of this are welcome"
    why: "A courtesy line, not a claim."

