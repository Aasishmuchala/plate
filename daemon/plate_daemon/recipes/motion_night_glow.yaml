# Motion recipe (T94): Night Glow (library shot as12, medium risk). A locked tripod sent as a single image
# (motion.start_end: false): dusk falls and the lights come on, so the end is not pinned to the dusk start frame.
# With an approved night still for the end, use motion_time_of_day. Negative prompt under 30 words.
schema: 1
id: motion_night_glow
title: Night glow
kind: motion_croppair
library: as12
engine: kling-o3-4k
shot_class: wide
croppair:
  z0: 1.0
  z1: 1.0
  center: [0.5, 0.5]
  direction: locked
motion:
  move: locked_tripod
  start_end: false
  duration_s: 8
  camera_fixed: true
params:
  n: 1
mask:
  editable_classes: []
  region: none
  lock_rest: false
prompt: |-
  Shot 1: wide shot, locked-off camera, dusk time-lapse. Over the clip the sky falls from blue hour into night and the building answers: interior lights come on room by room, facade grazers fade up, the water begins to glow. The lit windows warm as the sky cools, the building becoming a lantern in real time.
  SCENE LOCKS: geometry, materials and framing frozen; only sky and lighting change; lights come on one after another and never flicker; no camera movement.
negative_prompt: camera movement, zoom, pan, morphing, warping geometry, bending lines, flickering lights, texture crawl, new objects, people, text, logos
