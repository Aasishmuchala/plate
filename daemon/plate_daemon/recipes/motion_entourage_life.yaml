# Motion recipe (T94): Entourage Life (library shot as07). A locked tripod: the end crop is the start crop, so the
# walkers cross and leave before the last frame and the camera-lock gate measures the hold. No vehicles: PLATE does
# not generate cars; people that must stay in the frame go through the People node (STAFFAGE). Prompt law: motion
# only; no pace words under the end pin; negative prompt under 30 words.
schema: 1
id: motion_entourage_life
title: Entourage life
kind: motion_croppair
library: as07
engine: kling-o3-4k
shot_class: wide
croppair:
  z0: 1.0
  z1: 1.0
  center: [0.5, 0.5]
  direction: locked
motion:
  move: locked_tripod
  start_end: true
  duration_s: 5
  camera_fixed: true
params:
  n: 1
mask:
  editable_classes: []
  region: none
  lock_rest: false
prompt: |-
  Shot 1: wide shot, eye level, locked-off camera. Life crosses the approved frame: two people walk across the plaza in conversation and out of frame before the last frame, birds lift from the trees and resettle. Every figure at true scale to the doors, grounded with correct contact shadows. The building does not move; the light does not change.
  SCENE LOCKS: architecture, materials and framing identical to the source in every frame; the walkers never occlude the entrance; no one approaches the camera; no vehicles; no camera movement.
negative_prompt: camera movement, zoom, pan, morphing, warping geometry, giant people, floating figures, vehicles, crowds, flicker, new objects, text, logos
