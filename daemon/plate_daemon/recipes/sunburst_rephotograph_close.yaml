# P1 recipe 2: Sunburst re-photograph of a CLOSE shot on GPT Image 2.5, whole frame (library family a08, The Beauty Pass).
# Lessons (2026-10-17 render-to-photo bake-off): Sunburst/Flare win; name paving by stone and course size; run a
# plate+photo repair pass afterwards; native size beats an upscale. AI re-photography of wide or elevated plates was
# rejected (movie-grade is a render), so the router must call this a close shot or the recipe refuses.
schema: 1
id: sunburst_rephotograph_close
title: Sunburst re-photograph, close shot
kind: still_rephotograph
library: a08
engine: gpt-image-2.5
shot_class: close
mask:
  editable_classes: []
  region: none
  lock_rest: false
router_check:
  require_shot_class: close
  refuse_verdicts: [render_it, render_move]
  note: the render-it router (detail resolvability, disocclusion budget) decides; a close shot that still needs a render is refused
params:
  n: 1
  size: native
  repair_pass: plate_and_photo
overrides:
  "[SUN DIRECTION AND HEIGHT: FROM CAMERA LEFT, 12 DEGREES ABOVE THE HORIZON]": "from camera left, 12 degrees above the horizon"
  "[PAVING: NAME THE STONE AND ITS COURSE SIZE, E.G. 100 MM GRANITE SETTS]": "100 mm granite setts"
prompt: |-
  Re-photograph this approved architectural render as one real photograph, taken from the same position with the same lens. The framing, geometry, proportions and every material stay exactly where the render put them; nothing moves.
  Late-afternoon sun [SUN DIRECTION AND HEIGHT: FROM CAMERA LEFT, 12 DEGREES ABOVE THE HORIZON] rakes across the surfaces and throws long shadows. Where the sun touches an edge or a leaf, a natural sunburst starburst forms with a faint veiling flare, as a real lens would give.
  Materials read as real: [PAVING: NAME THE STONE AND ITS COURSE SIZE, E.G. 100 MM GRANITE SETTS] with a joint shadow and a slightly different tone per unit; plaster with fine trowel variation; metal with an honest satin sheen. Add only photographic character: natural highlight roll-off, subtle grain, a touch of vignette, micro-imperfections such as dust in the light and faint sheen variation.
  No HDR glow, no over-sharpening, no change of colour scheme, no added objects or people.
negative_prompt: HDR glow, over-sharpening, plastic sheen, repeated stone pattern, added objects, added people, changed geometry, re-framing, text, logos
