# Motion recipe (T94): Living Render (library shot as01, the tier-zero shot). A locked tripod: one zoom, the end crop
# is the start crop, so the end pin brings the clip back to the approved frame and the camera-lock gate measures the
# hold. Run it first on every new frame: it exposes drift before you spend on moves. Prompt law: motion only; with an
# end-frame pin the prompt never says slow, slowly, gently, leisurely or unhurried; the negative prompt stays under
# 30 words.
schema: 1
id: motion_locked_living
title: Living render (locked)
kind: motion_croppair
library: as01
engine: kling-o3-4k
shot_class: wide
croppair:
  z0: 1.0
  z1: 1.0
  center: [0.5, 0.5]
  direction: locked
motion:
  move: locked_tripod
  start_end: true
  duration_s: 5
  camera_fixed: true
params:
  n: 1
mask:
  editable_classes: []
  region: none
  lock_rest: false
prompt: |-
  Shot 1: wide shot, eye level, locked-off camera. The approved frame, alive: a light breeze moves the trees and planting with natural mass, the water surface ripples, clouds drift almost imperceptibly, a bird crosses the far sky. Light constant throughout; the last frame settles back onto the first.
  SCENE LOCKS: architecture, materials and framing identical to the source image in every frame; straight lines stay straight; no people enter; no objects appear; no camera movement of any kind.
negative_prompt: camera movement, zoom, pan, morphing, warping geometry, bending lines, flicker, texture crawl, new objects, people, text, logos, camera shake
