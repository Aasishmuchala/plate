# Motion recipe (T94): Interior Slider Drift (library shot as03). One zoom (1.1, so the frame has room to slide) and an
# end centre 3 % of the frame to the right: centimetres of lateral travel, cut from the source view only, both ends
# pinned. Prompt law: motion only; no pace words under the end pin; negative prompt under 30 words.
schema: 1
id: motion_slider_drift
title: Slider drift
kind: motion_croppair
library: as03
engine: kling-o3-4k
shot_class: medium
croppair:
  z0: 1.1
  z1: 1.1
  center: [0.5, 0.5]
  center_end: [0.53, 0.5]
  direction: locked
motion:
  move: slider_drift
  start_end: true
  duration_s: 5
  camera_fixed: false
params:
  n: 1
mask:
  editable_classes: []
  region: none
  lock_rest: false
prompt: |-
  Shot 1: medium shot, 50mm lens, chest height, lateral slider drift left to right, a few centimetres of travel. The camera drifts across the space from the first frame to the last frame; the framing is set by those two frames. Foreground furniture slides against the deeper room in quiet layers of parallax; sheer curtains breathe at the glazing; dust motes drift in the window light.
  SCENE LOCKS: furniture, materials and architecture identical to the source; travel stays under ten centimetres; verticals stay vertical; no reframe beyond the drift; light constant; no other camera movement.
negative_prompt: morphing, warping geometry, bending verticals, flicker, texture crawl, new objects, people, text, logos, camera shake, zoom, extra movement
