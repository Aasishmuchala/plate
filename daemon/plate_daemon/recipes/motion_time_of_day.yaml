# Motion recipe (T94): Time of Day (library shot as08 adapted, decision 49). Two approved stills of ONE camera (the
# Motion node's image and end inputs: a day still and its relit dusk still, say), each sent whole at z = 1: the light
# changes between two real frames and the camera does not move. The croppair block is the locked frame both stills
# share. Prompt law: motion only; no pace words under the end pin; negative prompt under 30 words.
schema: 1
id: motion_time_of_day
title: Time of day (two stills)
kind: motion_croppair
library: as08
engine: kling-o3-4k
shot_class: wide
croppair:
  z0: 1.0
  z1: 1.0
  center: [0.5, 0.5]
  direction: locked
motion:
  move: locked_tripod
  start_end: true
  two_stills: true
  duration_s: 8
  camera_fixed: true
params:
  n: 1
mask:
  editable_classes: []
  region: none
  lock_rest: false
prompt: |-
  Shot 1: wide shot, locked-off camera. The light changes from the first frame to the last frame; the camera does not move. Shadows rotate and lengthen in one continuous motion, the colour temperature travels from the first frame's to the last frame's, the sky turns with it. The building receives the change; nothing else happens.
  SCENE LOCKS: geometry, materials and framing identical in every frame; the ONLY change is light and sky; shadow edges stay crisp and correctly cast throughout; no flicker; no camera movement.
negative_prompt: camera movement, zoom, pan, morphing, warping geometry, bending lines, flicker, strobing shadows, texture crawl, new objects, people, text, logos
