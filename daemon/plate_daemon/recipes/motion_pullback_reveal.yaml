# Motion recipe (T94): Pull-back Reveal (library shot as02 reversed). A pull-back, 1.25 -> 1.0: the start is the
# tighter crop and the end the approved still's full frame, so everything the move reveals is in the render. The
# reveal dial stands (reveal_m on the node raises the risk). Prompt law: motion only; no pace words under the end
# pin; negative prompt under 30 words.
schema: 1
id: motion_pullback_reveal
title: Pull-back reveal
kind: motion_croppair
library: as02
engine: kling-o3-4k
shot_class: wide
croppair:
  z0: 1.25
  z1: 1.0
  center: [0.5, 0.5]
  direction: out
motion:
  move: push_in
  start_end: true
  duration_s: 5
  camera_fixed: false
params:
  n: 1
mask:
  editable_classes: []
  region: none
  lock_rest: false
prompt: |-
  Shot 1: wide shot, 35mm lens, eye level, steady pull-back at constant speed. Starting framed on the entrance, the camera retreats to the full facade; the framing is set by the first and the last frame. Planting sways at the frame edges; reflections travel across the glazing as the view widens; shadows hold their angle.
  SCENE LOCKS: mullions and facade lines stay straight and true through the entire move; no new geometry appears at the edges; light and materials constant; no other camera movement.
negative_prompt: morphing, warping geometry, bending lines, flicker, texture crawl, new objects, people, text, logos, camera shake, extra movement
