# P1 recipe 3: CropPair push-in on Kling O3 4K with a start and an end frame (library shot as02, Facade Push-In, low risk).
# Both frames are crops of the SAME approved still (centre c, zoom z0 then z1, same scale factor), so the engine only
# has to interpolate between two real crops. Prompt laws: motion only; with an end-frame pin the prompt never says
# slow, slowly, gently or leisurely; the negative prompt stays under 30 words.
schema: 1
id: croppair_pushin
title: CropPair push-in
kind: motion_croppair
library: as02
engine: kling-o3-4k
shot_class: wide
croppair:
  z0: 1.0
  z1: 1.18
  center: [0.5, 0.5]
motion:
  move: push_in
  start_end: true
  duration_s: 5
  camera_fixed: false
params:
  n: 1
mask:
  editable_classes: []
  region: none
  lock_rest: false
prompt: |-
  Shot 1: steady push-in at constant speed, eye level. The camera advances from the first frame to the last frame; the framing is set by those two frames. Planting sways at the frame edges, reflections travel across the glazing as the angle tightens, shadows hold their angle.
  SCENE LOCKS: mullions and facade lines stay straight through the whole move; no new geometry appears at the edges; light and materials constant; no people enter; no other camera movement.
negative_prompt: morphing, warping geometry, bending lines, flicker, texture crawl, new objects, people, text, logos, camera shake, extra movement
