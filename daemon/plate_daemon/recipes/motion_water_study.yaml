# Motion recipe (T94): Water Study (library shot as11). A locked tripod: the end crop is the start crop, so the water
# settles back onto the approved frame and the camera-lock gate measures the hold. Prompt law: motion only; no pace
# words under the end pin; negative prompt under 30 words.
schema: 1
id: motion_water_study
title: Water study
kind: motion_croppair
library: as11
engine: kling-o3-4k
shot_class: medium
croppair:
  z0: 1.0
  z1: 1.0
  center: [0.5, 0.5]
  direction: locked
motion:
  move: locked_tripod
  start_end: true
  duration_s: 5
  camera_fixed: true
params:
  n: 1
mask:
  editable_classes: []
  region: none
  lock_rest: false
prompt: |-
  Shot 1: medium shot, low over the water, locked-off camera. The water carries the shot: the facade's reflection wobbles on the surface, fine ripples travel with the breeze, caustic light dances on the underside of the soffit, a leaf lands and sends one ring outward. The real building above stays perfectly still.
  SCENE LOCKS: architecture, materials and framing identical to the source; the reflection distorts only with the water's physics; water level constant; no camera movement.
negative_prompt: camera movement, zoom, pan, morphing, warping geometry, bending lines, rising water, flicker, texture crawl, new objects, people, text, logos
