# PLATE gate thresholds, one entry per metric. Threshold-set id: ts-2026.10.18-draft (the active set).
#
# Changing a number means adding a NEW set id; a shipped report keeps pointing at the set it was scored
# against. The previous set, ts-2026.10.17-draft, is frozen in threshold_sets/ and still loads
# (plate_gates.threshold_sets.load_set). ts-2026.10.18-draft = that set, plus the router, depth-agreement,
# cross-view and recolour numbers that lived only as module constants, with feather_band.de00_p99 advisory
# and the ensemble weights below. Fields per entry:
#   id             metric id (what a gate reports under)
#   value | range  the bound, or [low, high] inclusive; with `value`, `op` is le | ge | eq
#   resolution_px  image width the number is only valid at (null = resolution independent)
#   status         hard (blocks) | advisory (reported, never blocks) | calibration_needed (advisory until the
#                  three-key labelling AUC fixes it; see calib/)
#   provenance     where the number came from
# Optional: unit, tier (the gate only applies to that packet tier), tol (eq tolerance), variants
# (named alternative bounds, e.g. preview), status_by_backend (status depends on the flow backend), param
# (the bound is supplied at check time, e.g. the shot duration).
set_id: ts-2026.10.18-draft
metrics:
  - id: registration.residual_px
    op: le
    value: 1.0
    unit: px
    resolution_px: null
    status: hard
    provenance: BUILD_PLAN section 3 decision 14 (plate-vs-output registration residual after ECC)
  - id: registration.shift_px
    op: le
    value: 8
    unit: px
    resolution_px: null
    status: hard
    provenance: BUILD_PLAN decision 14; best_shift search window of fidelity_bench (+-8 px)
  - id: outside_mask.de00
    op: eq
    value: 0
    tol: 0.0
    unit: dE00
    resolution_px: null
    status: hard
    provenance: Plan decision 4; outside-mask pixels are copied from the plate by slicing, so this holds by construction
  - id: feather_band.de00_p99
    op: le
    value: 1.0
    unit: dE00
    resolution_px: null
    status: advisory
    provenance: BUILD_PLAN decision 14 set it hard at 1.0; ts-2026.10.18-draft makes it advisory because 1.0 fails any large in-mask edit (T16 integration note, wave 8 decision 35) until the three-key labelling (T23) fixes a measured bound; feather lives inside the mask (4-12 px)
  - id: gbuffer_edge_recall_r2
    op: ge
    value: 0.90
    variants:
      delivery: 0.90
      preview: 0.85
    tier: A
    resolution_px: 2048
    status: hard
    provenance: BUILD_PLAN decision 14; computable only against G-buffer edges (Tier A), never against image-only Canny
  - id: invention_flags
    op: eq
    value: 0
    tol: 0.0
    unit: count
    resolution_px: null
    status: hard
    provenance: BUILD_PLAN decision 14 (architecture invention flags)
  - id: material.de00_median
    op: le
    value: 2
    unit: dE00
    resolution_px: null
    status: hard
    provenance: BUILD_PLAN decision 14 (per-material dE00 by Cryptomatte id)
  - id: material.de00_p90
    op: le
    value: 5
    unit: dE00
    resolution_px: null
    status: hard
    provenance: BUILD_PLAN decision 14
  - id: ral.de00
    op: le
    value: 1
    unit: dE00
    resolution_px: null
    status: hard
    provenance: BUILD_PLAN decision 14 (RAL swatch against the mean Lab of the masked material)
  - id: texture.lapvar
    range: [300, 600]
    resolution_px: 3840
    status: hard
    provenance: car-entry lesson, movie-grade refs measured 377-539 at 3840 wide (>1500 synthetic crunch, <250 soft); valid for native 4K frames only
  - id: texture.fine_ratio
    range: [0.40, 0.60]
    resolution_px: 3840
    status: calibration_needed
    provenance: Aparna refs 0.53 / 0.45 under the current formula (scout 03); BUILD_PLAN's 0.35-0.45 band is wrong for it
  - id: tone.luma
    range: [100, 120]
    resolution_px: 3840
    status: advisory
    provenance: Aparna gate/street interpolation (scout 03)
  - id: tone.contrast
    range: [52, 60]
    resolution_px: 3840
    status: advisory
    provenance: Aparna gate/street interpolation (scout 03)
  - id: tone.sat
    range: [55, 65]
    resolution_px: 3840
    status: advisory
    provenance: Aparna gate/street interpolation (scout 03)
  - id: video.first_frame
    op: le
    value: 12
    unit: levels/255
    resolution_px: null
    status: calibration_needed
    provenance: accepted clips measure first-frame MAE 3.8-10.0 on an aspect-mismatched resize (amphi S3 3.8, couple AER_A 7.4, AER_B 7.6, car S1_take1 10.0); the plan's 8 failed shipped work
  - id: video.last_frame
    op: le
    value: 16
    unit: levels/255
    resolution_px: null
    status: calibration_needed
    provenance: accepted clips measure last-frame MAE 5.8-14.2 (amphi S3 5.8, couple AER_A 14.2, AER_B 12.4, car S1_take1 9.9); the plan's 14 failed shipped work
  - id: video.camera_lock_median_flow_px
    op: le
    value: 1.0
    unit: px
    resolution_px: 960
    status: advisory
    status_by_backend:
      raft: hard
      dis: advisory
    provenance: BUILD_PLAN decision 11; RAFT is the box path (hard), cv2 DIS flow is the Mac fallback (advisory) and the report states the backend
  - id: video.phase_corr_px
    op: le
    value: 2
    unit: px
    resolution_px: null
    status: advisory
    provenance: clip_gate.py phase-correlation camera lock (2 px); triage only
  - id: video.reproj_edge_recall
    op: ge
    value: 0.8
    resolution_px: 960
    status: hard
    provenance: BUILD_PLAN decision 14 (reprojection drift against packet G-buffer edges)
  - id: video.duration_s
    op: ge
    param: shot_duration_s
    unit: s
    resolution_px: null
    status: hard
    provenance: the delivered clip must cover the shot (bound supplied at check time)
  - id: image_edge_agreement
    op: ge
    value: 0.88
    resolution_px: 1920
    status: advisory
    provenance: car-entry README (>= 0.88 locked, 0.76-0.78 acceptable); image-only Canny agreement is triage only
  - id: long_edge_min_px
    op: param
    value: 30
    unit: px
    resolution_px: 1500
    status: hard
    provenance: fidelity_bench LONG = 30 px at 1500 wide; scaled as round(30 * width / 1500)
  - id: router.D_px_median
    op: ge
    value: 8.0
    variants:
      vray_only_below: 8.0
      whole_frame_at_or_above: 24.0
    unit: px
    resolution_px: null
    status: advisory
    provenance: BUILD_PLAN decision 15 via T28 (router_math.D_VRAY_ONLY_PX 8, D_WHOLE_FRAME_PX 24); median detail size D(p) = fx * s / Z(p); below 8 px render in V-Ray, 8 to 24 px AI by region, 24 px and over a whole-frame re-photograph may be allowed. Advisory while PLATE_ROUTER_MODE is advisory (P1); blocking mode (P3) is a router setting, not a threshold status
  - id: router.disocclusion_fraction
    op: le
    value: 0.02
    variants:
      ai_interpolate_max: 0.02
      rendered_endpoints_plus_clay_max: 0.10
    unit: fraction
    resolution_px: null
    status: advisory
    provenance: BUILD_PLAN decision 15 via T28 (router_math.DISOCC_AI_MAX 0.02, DISOCC_CLAY_MAX 0.10); share of end-frame pixels the start frame never saw; up to 2 % AI may interpolate, 2 to 10 % rendered start and end frames plus a clay reference, over 10 % render the move
  - id: router.orbit_deg
    op: le
    value: 30.0
    unit: deg
    resolution_px: null
    status: advisory
    provenance: BUILD_PLAN decision 15 via T28 (router_math.ORBIT_MAX_DEG 30); an orbit over 30 degrees is rendered whatever the disocclusion fraction
  - id: depth_agreement.abs_rel
    op: le
    value: 0.10
    unit: ratio
    resolution_px: null
    status: advisory
    tier: C
    provenance: T16 depth_agreement.compare (median |a*z_ref+b - z_est| / z_est after the scale-and-shift fit). The module defines the metric and no bound; 0.10 is a first-guess triage number, to be fitted by calibration (router plan decision 3, image-only depth agreement is never a delivery gate)
  - id: depth_agreement.delta_1
    op: ge
    value: 0.90
    unit: fraction within 1.25x
    resolution_px: null
    status: advisory
    tier: C
    provenance: T16 depth_agreement.compare (fraction of valid pixels within DELTA_1_RATIO 1.25 of z_est, either way). First-guess triage bound, no calibrated data yet
  - id: depth_agreement.edge_f1
    op: ge
    value: 0.50
    unit: F1 at 2 px, 2 % rule
    resolution_px: null
    status: advisory
    tier: C
    provenance: T16 depth_agreement.compare (F1 of the depth-edge maps, EDGE_REL 0.02, EDGE_TOL_PX 2). First-guess triage bound, no calibrated data yet
  - id: set.cross_view_de00_p90
    op: le
    value: 3.0
    unit: dE00
    resolution_px: null
    status: hard
    provenance: T30 setgate.P90_HARD; p90 of the per-material dE00 between a view's output and the hero view's target Lab at world-position correspondences (Set-consistency gate)
  - id: recolour.de00_median
    op: le
    value: 1.0
    variants:
      recomposition: 1.0
      ratio: 2.5
      degraded: 4.0
    unit: dE00
    resolution_px: null
    status: advisory
    provenance: T31 recolour.EXPECTED_DE00 per method (recomposition 1.0, ratio 2.5, degraded 4.0); median dE00 of the recoloured material against the re-rendered one. Advisory because the degraded path is expected to miss on dark semi-gloss panels (correct behaviour); the base value is the recomposition bound

# Weights of the calibration ensemble (calib/README.md format), T23's DEFAULT_ENSEMBLE. A weight is a number or
# {weight, scale}. Every id must be a metric above. A first guess: refit only with enough labels to fit on a set
# other than the one the bet is scored on, and re-issue the set id when it changes.
ensemble:
  registration.residual_px: 2.0
  registration.shift_px: 1.0
  outside_mask.de00: 1.0
  feather_band.de00_p99: 1.0
  gbuffer_edge_recall_r2: 3.0
  invention_flags: 3.0
  material.de00_median: 2.0
  material.de00_p90: 1.0
  ral.de00: 1.0
  texture.lapvar: 2.0
  texture.fine_ratio: 1.0
  tone.luma: 0.5
  tone.contrast: 0.5
  tone.sat: 0.5
  video.first_frame: 1.0
  video.last_frame: 1.0
  video.camera_lock_median_flow_px: 2.0
  video.phase_corr_px: 0.5
  video.reproj_edge_recall: 2.0
  image_edge_agreement: 0.5
