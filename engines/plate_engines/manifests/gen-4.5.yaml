# gen-4.5 -- Runway Gen-4.5 image-to-video via the Runway Dev API (D, user's own key).
# Start frame only: Gen-4.5 takes no last frame and no references on image_to_video. A prompt is required.
# mp4 only: the ProRes / HDR `outputFormat` surcharges are not offered.
# PLACEHOLDERS (BUILD_PLAN decisions 9 and 13): version is unpinned until the live smoke test; the manifest-level
# price.usd is NOT a confirmed vendor price while its status is unconfirmed (the confirmed figure is on the runway
# route's own price); "unknown" means not yet established in writing. Runway's upload and output hosts are
# unverified (flag runway_hosts_unverified) until the live smoke records the real ones.
# Wave 11: `runway` route (preferred for video by rule, not by order; decisions 61-64).
# The adapter maps the ratio names to Runway's pixel ratios: 16:9 = 1280:720, 9:16 = 720:1280, 4:3 = 1104:832,
# 1:1 = 960:960, 3:4 = 832:1104, 21:9 = 1584:672. Centre-cropping an off-ratio frame is refused, never accepted.
id: gen-4.5
name: Runway Gen-4.5
version: unpinned
pinned: false
kind: video_i2v
model_id: gen4.5
flags: [runway_hosts_unverified]
inputs:
  - {name: image, type: image, required: true}
  - {name: prompt, type: text, required: true}
outputs:
  - {name: video, type: video, required: true}
params:
  - {name: duration, type: int, default: 5, range: [2, 10]}
  - {name: ratio, type: enum, default: "16:9", enum: ["16:9", "9:16", "4:3", "1:1", "3:4", "21:9"]}
  - {name: seed, type: int, range: [0, 4294967295], advanced: true}
sizes:
  legal:
    - {w: 1280, h: 720, label: "16:9"}
    - {w: 720, h: 1280, label: "9:16"}
    - {w: 1104, h: 832, label: "4:3"}
    - {w: 960, h: 960, label: "1:1"}
    - {w: 832, h: 1104, label: "3:4"}
    - {w: 1584, h: 672, label: "21:9"}
price:
  model: per_second
  usd: 0.12
  status: unconfirmed
  source: "docs.dev.runwayml.com/guides/pricing.md read 2026-10-18; the confirmed figure is on the runway route's own price"
  as_of: 2026-10-18
  notes: "UNCONFIRMED at manifest level: the route's own price (USD 0.12 per second, 12 credits) is the catalogue figure; the first bill reconciles it."
determinism: nondeterministic
licence:
  vendor_terms_url: "https://runway.com/terms-of-use"
  training_opt_out: false
allowed_tasks: [crop_pair_motion]
routes:
  - provider: runway
    endpoint: https://api.dev.runwayml.com/v1
    region: us
    custody_grade: D
    custody_status: confirmed
    terms_hash: unknown
    upload_visibility: private
    same_model_fallback_of: null
    model_slug: gen4.5
    allowed_hosts: [api.dev.runwayml.com, .cloudfront.net, .amazonaws.com]
    max_inflight: 1
    note: "Runway Dev API, the user's own key (RUNWAYML_API_SECRET). Self-serve Terms of Use (15 Sep 2026) s4.4: Inputs and Outputs may be used to train Runway's models under a perpetual licence; D on the evidence. C2 when a signed Runway Dev Enterprise agreement (no training, zero retention) is filed: custody_grade C2, custody_status confirmed, terms_hash = sha256 of the signed agreement. Sub-processors on this route: Google Cloud (US), Byteplus Pte (Singapore), Kling AI Pte (Singapore). Output URLs are signed and expire in 24-48 h; uploads are 24 h ephemeral runway:// URIs."
    price:
      model: per_second
      usd: 0.12
      status: confirmed
      source: "docs.dev.runwayml.com/guides/pricing.md, USD 0.01 per credit, read 2026-10-18 and skeptic-checked (router/research/runway/pricing_terms.md)"
      as_of: 2026-10-18
      notes: "Gen-4.5 has no audio; 12 credits per second"
