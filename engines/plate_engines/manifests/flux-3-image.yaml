# flux-3-image -- Black Forest Labs image edit, direct (D).
# PLACEHOLDERS (BUILD_PLAN decisions 9 and 13): version is unpinned until the P0 smoke test; price.usd is
# NOT a vendor price while status is unconfirmed; "unknown" means not yet established in writing. Other
# endpoints are the vendors' public base URLs as understood on 2026-10-17 and stay unverified until the
# adapter smoke tests. Custody status "pending_written_terms" is treated as grade D by the router.
id: flux-3-image
name: FLUX 3 Image
version: unpinned
pinned: false
kind: image_edit
inputs:
  - {name: image, type: image, required: true}
  - {name: prompt, type: text, required: true}
  - {name: mask, type: mask, required: false}
  - {name: reference_images, type: images, required: false}
outputs:
  - {name: image, type: image, required: true}
params:
  - {name: seed, type: int, default: null, range: null, enum: null}
price:
  model: per_image
  usd: 0.0
  status: unconfirmed
  notes: "UNCONFIRMED placeholder: usd is not a vendor price; refresh from the vendor catalogue at P0. Pricing unit (per image) is also assumed."
determinism: nondeterministic
licence:
  vendor_terms_url: unknown
  training_opt_out: null
allowed_tasks: [relight, vegetation, sky, rephotograph_close]
routes:
  - provider: bfl
    endpoint: https://api.bfl.ai/v1
    region: unknown
    custody_grade: D
    custody_status: confirmed
    terms_hash: unknown
    upload_visibility: unknown
    same_model_fallback_of: null
    note: "EU terms take a training licence, so grade D for NDA work."
