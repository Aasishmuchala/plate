# nano-banana-2.1 -- Google image edit, direct Gemini (C1 candidate) or via Atlas (D).
# PLACEHOLDERS (BUILD_PLAN decisions 9 and 13): version is unpinned until the P0 smoke test; price.usd is
# NOT a confirmed vendor price while status is unconfirmed; "unknown" means not yet established in writing. Other
# endpoints are the vendors' public base URLs as understood on 2026-10-17 and stay unverified until the
# adapter smoke tests. Custody status "pending_written_terms" is treated as grade D by the router.
# T7: params are the vendor FULL schema (advanced: true only hides a field in the UI drawer). price.usd is the
# default-tier figure the router ranks on; price.by holds the tiers we know. Nothing is billed-price-verified yet.
id: nano-banana-2.1
name: Nano Banana 2.1
version: unpinned
pinned: false
kind: image_edit
# NB 2.1 shipped 2026-10-07; its Gemini model id is not in any primary source we hold. Null until the P0 models.list.
model_id: null
flags: [unverified_p0]
inputs:
  - {name: image, type: image, required: true}
  - {name: prompt, type: text, required: true}
  - {name: mask, type: mask, required: false}
  - {name: reference_images, type: images, required: false, max_items: 13}
outputs:
  - {name: image, type: image, required: true}
params:
  - {name: aspect_ratio, type: enum, enum: ["1:1", "3:2", "2:3", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9", "4:1", "1:4", "8:1", "1:8"]}
  - {name: image_size, type: enum, enum: ["1K", "2K", "4K"]}
  - {name: seed, type: int, range: [0, 2147483647], advanced: true}
  - {name: temperature, type: float, range: [0, 2], advanced: true}
  - {name: thinking_level, type: enum, enum: ["minimal", "high"], advanced: true}
  - {name: candidate_count, type: int, default: 1, range: [1, 4], advanced: true}
  - {name: system_prompt, type: str, advanced: true}
sizes:
  legal:
    - {w: 1024, h: 1024, label: "1K"}
    - {w: 2048, h: 2048, label: "2K"}
    - {w: 4096, h: 4096, label: "4K"}
  auto: true
  aspects: ["1:1", "3:2", "2:3", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9", "4:1", "1:4", "8:1", "1:8"]
price:
  model: per_image
  usd: 0.034
  by: {"1K": 0.034}
  # T84: priced by the image_size param. Only 1K has a reading; 2K and 4K are estimates (open question 19).
  tiers:
    - {match: {image_size: "1K"}, usd: 0.034}
    - {match: {image_size: "2K"}, usd: 0.068, status: estimated, note: "2x the 1K figure per tier step (not by pixel count) until the P0 smoke test bills it"}
    - {match: {image_size: "4K"}, usd: 0.136, status: estimated, note: "4x the 1K figure (2x per tier step, not by pixel count) until the P0 smoke test bills it"}
  status: unconfirmed
  source: "VIZMAKER.md section 4: Google vendor list for a 1K NB 2.1 edit (read beside the in-app price). 2K and 4K are not priced anywhere we hold."
  as_of: 2026-10-17
  notes: "UNCONFIRMED: usd is the 1K list figure. 2K and 4K quotes fall back to it and must be read as a floor until the P0 smoke test bills them."
determinism: nondeterministic
licence:
  vendor_terms_url: unknown
  training_opt_out: null
allowed_tasks: [relight, people, vegetation, sky, rephotograph_close]
routes:
  - provider: gemini
    endpoint: https://generativelanguage.googleapis.com
    region: unknown
    custody_grade: C1
    custody_status: pending_written_terms
    terms_hash: unknown
    upload_visibility: private
    same_model_fallback_of: null
    allowed_hosts: [generativelanguage.googleapis.com]
    note: "Gemini direct is a C1 candidate only: written no-training and zero-retention terms not yet held."
  - provider: atlas
    endpoint: https://api.atlascloud.ai/api/v1
    region: unknown
    custody_grade: D
    custody_status: confirmed
    terms_hash: unknown
    upload_visibility: public
    same_model_fallback_of: null
    allowed_hosts: [.atlascloud.ai, .aliyuncs.com]
    note: "Atlas uploadMedia returns public OSS URLs: grade D, refused for NDA projects."
