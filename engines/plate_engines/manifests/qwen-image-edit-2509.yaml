# qwen-image-edit-2509 -- local image edit (C0).
# PLACEHOLDERS (BUILD_PLAN decisions 9 and 13): version is unpinned until the P0 smoke test; price.usd is
# NOT a confirmed vendor price while status is unconfirmed; "unknown" means not yet established in writing. Other
# endpoints are the vendors' public base URLs as understood on 2026-10-17 and stay unverified until the
# adapter smoke tests. Custody status "pending_written_terms" is treated as grade D by the router.
# T7: params are the vendor FULL schema (advanced: true only hides a field in the UI drawer). price.usd is the
# default-tier figure the router ranks on; price.by holds the tiers we know. Nothing is billed-price-verified yet.
id: qwen-image-edit-2509
name: Qwen-Image-Edit-2509 (ControlNet depth and edge)
version: unpinned
pinned: false
kind: local_image
model_id: Qwen/Qwen-Image-Edit-2509
inputs:
  - {name: image, type: image, required: true}
  - {name: prompt, type: text, required: true}
  - {name: mask, type: mask, required: false}
  - {name: reference_images, type: images, required: false}
  - {name: depth, type: image, required: false}
  - {name: edges, type: image, required: false}
outputs:
  - {name: image, type: image, required: true}
params:
  - {name: seed, type: int, range: [0, 4294967295], advanced: true}
  - {name: num_inference_steps, type: int, default: 40, range: [1, 100]}
  - {name: true_cfg_scale, type: float, default: 4.0, range: [1, 20]}
  - {name: negative_prompt, type: str, advanced: true}
  - {name: controlnet_depth_scale, type: float, default: 1.0, range: [0, 2]}
  - {name: controlnet_edge_scale, type: float, default: 1.0, range: [0, 2]}
  - {name: precision, type: enum, default: "fp8", enum: ["fp8", "bf16"], advanced: true}
price:
  model: per_image
  usd: 0.0
  status: confirmed
  source: "Local compute on owned hardware; no vendor fee."
  as_of: 2026-10-17
  notes: "Local compute on owned hardware; no vendor fee. Power and amortisation are not modelled."
determinism: best_effort
licence:
  vendor_terms_url: unknown
  training_opt_out: null
allowed_tasks: [relight, people, vegetation, sky, rephotograph_close]
routes:
  - provider: local
    endpoint: local
    region: local
    custody_grade: C0
    custody_status: confirmed
    terms_hash: unknown
    upload_visibility: local
    same_model_fallback_of: null
    max_inflight: 1
    note: "Runs on the render box; nothing leaves it."
