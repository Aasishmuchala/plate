# seedance-2.5-r2v -- ByteDance reference-to-video via Atlas (D); same-model fallbacks.
# PLACEHOLDERS (BUILD_PLAN decisions 9 and 13): version is unpinned until the P0 smoke test; price.usd is
# NOT a confirmed vendor price while status is unconfirmed; "unknown" means not yet established in writing. Other
# endpoints are the vendors' public base URLs as understood on 2026-10-17 and stay unverified until the
# adapter smoke tests. Custody status "pending_written_terms" is treated as grade D by the router.
# T7: params are the vendor FULL schema (advanced: true only hides a field in the UI drawer). price.usd is the
# default-tier figure the router ranks on; price.by holds the tiers we know. Nothing is billed-price-verified yet.
# Seedance 2.5 limits (scout 02, ByteDance model docs 2026-08-27, re-verify): 4-30 s, 480p/720p 8-bit and 1080p 10-bit,
# NO 4K, 24 fps output, input aspect 0.4-2.5, input sides 300-6000 px, 30 images + 10 videos (+ 10 audio) per call.
# Wave 11: `runway` route (preferred for video by rule, not by order; decisions 61-64).
id: seedance-2.5-r2v
name: Seedance 2.5 reference-to-video
version: unpinned
pinned: false
kind: video_r2v
model_id: dreamina-seedance-2-5-260628
flags: [unverified_p0, runway_hosts_unverified]
inputs:
  - {name: reference_images, type: images, required: true, max_items: 30}
  - {name: reference_videos, type: video, required: false, max_items: 10}
  - {name: prompt, type: text, required: true}
outputs:
  - {name: video, type: video, required: true}
params:
  - {name: duration, type: int, default: 5, range: [4, 30]}
  - {name: resolution, type: enum, default: "480P", enum: ["480P", "720P", "1080P"]}
  - {name: ratio, type: enum, default: "adaptive", enum: ["adaptive", "21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]}
  - {name: camera_fixed, type: bool, default: false}
  - {name: generate_audio, type: bool, default: false}
  - {name: return_last_frame, type: bool, default: false, advanced: true}
  - {name: seed, type: int, range: [-1, 2147483647], advanced: true}
sizes:
  arbitrary: {min_side: 300, max_side: 6000, aspect_min: 0.4, aspect_max: 2.5}
  aspects: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
price:
  model: per_second
  usd: 0.10
  status: unconfirmed
  source: "Scout 02: staffage COST_PER_SECOND_USD 0.10 (Seedance 2.0 on Atlas). Seedance 2.5 reference-to-video is not priced anywhere we hold."
  as_of: 2026-10-17
  notes: "UNCONFIRMED placeholder: usd is not a vendor price; read the billed price from the P0 smoke test. Pricing unit (per second) is assumed."
determinism: nondeterministic
licence:
  vendor_terms_url: unknown
  training_opt_out: null
allowed_tasks: [crop_pair_motion, previs]
routes:
  - provider: atlas
    endpoint: https://api.atlascloud.ai/api/v1
    region: unknown
    custody_grade: D
    custody_status: confirmed
    terms_hash: unknown
    upload_visibility: public
    same_model_fallback_of: null
    model_slug: bytedance/seedance-2.5/reference-to-video
    allowed_hosts: [.atlascloud.ai, .aliyuncs.com]
    note: "Atlas uploadMedia returns public OSS URLs: grade D, refused for NDA projects."
  - provider: byteplus
    endpoint: unknown
    region: unknown
    custody_grade: D
    custody_status: pending_written_terms
    terms_hash: unknown
    upload_visibility: unknown
    same_model_fallback_of: atlas
    model_slug: dreamina-seedance-2-5-260628
    allowed_hosts: [.bytepluses.com]
    note: "Same model, other provider: fallback of the atlas route only, re-quoted, never silent."
  - provider: wavespeed
    endpoint: unknown
    region: unknown
    custody_grade: D
    custody_status: pending_written_terms
    terms_hash: unknown
    upload_visibility: unknown
    same_model_fallback_of: atlas
    allowed_hosts: [.wavespeed.ai]
    note: "Same model, other provider: fallback of the atlas route only, re-quoted, never silent."
  - provider: runway
    endpoint: https://api.dev.runwayml.com/v1
    region: us
    custody_grade: D
    custody_status: confirmed
    terms_hash: unknown
    upload_visibility: private
    same_model_fallback_of: null
    model_slug: seedance2_5
    allowed_hosts: [api.dev.runwayml.com, .cloudfront.net, .amazonaws.com]
    max_inflight: 1
    note: "Runway Dev API, the user's own key (RUNWAYML_API_SECRET). Self-serve Terms of Use (15 Sep 2026) s4.4: Inputs and Outputs may be used to train Runway's models under a perpetual licence; D on the evidence. C2 when a signed Runway Dev Enterprise agreement (no training, zero retention) is filed: custody_grade C2, custody_status confirmed, terms_hash = sha256 of the signed agreement. Sub-processors on this route: Google Cloud (US), Byteplus Pte (Singapore), Kling AI Pte (Singapore). Output URLs are signed and expire in 24-48 h; uploads are 24 h ephemeral runway:// URIs."
    price:
      model: per_second
      usd: 0.20
      minimum_usd: 0.80
      status: confirmed
      source: "docs.dev.runwayml.com/guides/pricing.md, USD 0.01 per credit, read 2026-10-18 and skeptic-checked (router/research/runway/pricing_terms.md)"
      as_of: 2026-10-18
      notes: "audio off unless generate_audio is true; 480P is Runway's draft tier; at least 80 credits (USD 0.80) per generation"
      tiers:
        - {match: {resolution: "480P"}, usd: 0.20, status: confirmed}
        - {match: {resolution: "720P"}, usd: 0.30, status: confirmed}
        - {match: {resolution: "1080P"}, usd: 0.68, status: confirmed}
