name: ci
on: [push, pull_request]
permissions:
  contents: read
# No vendor network in CI: PLATE_LIVE is never set, every engine and the pixels worker run on fixtures and stubs.
jobs:
  check:
    # One matrix, both operating systems PLATE runs on (BUILD_PLAN decision 30). Steps run in the order of
    # scripts/test.ps1 and `make test`; the fidelity harness proves itself before anything else runs.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # FedericoCarboni/setup-ffmpeg supports x64 only; macos-latest runners are arm64, so macOS takes Homebrew's.
      - if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - if: runner.os == 'macOS'
        name: ffmpeg (Homebrew)
        run: brew install ffmpeg || brew upgrade ffmpeg
      - name: uv sync
        run: uv sync --python 3.12
      - name: npm ci (root workspace, includes ui)
        run: npm ci
      - name: fidelity_bench selftest
        run: uv run --no-sync python -m plate_gates.fidelity_bench selftest
        env:
          PYTHONPATH: gates
      - name: hazard scanner selftest
        run: uv run --no-sync python scripts/hazard_scan.py --selftest
      - name: Windows-hazard scan
        # --strict-allow also fails on a scripts/hazard_allow.txt entry that no longer matches anything.
        run: uv run --no-sync python scripts/hazard_scan.py --strict-allow
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: licence registry
        # Fails the build when any pixels/ module or requirements file names a non-commercial model weight.
        run: uv run --no-sync python -m plate_pixels.licences --check
      - name: pytest
        run: uv run --no-sync pytest
      - name: pytest scripts
        # scripts/ is outside pytest's testpaths: the hazard scanner, claims check and CI parity tests.
        run: uv run --no-sync pytest scripts/tests
      - name: claims as tests
        # Every public claim in README.md and docs/client-explainer.md must have a passing test (claims.yaml).
        run: uv run --no-sync python scripts/claims_check.py
      - name: npm test
        run: npm test
      - name: npm run build
        run: npm run build
